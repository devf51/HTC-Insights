<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เส้นทางเนื้อหาผ่านการคัดกรอง · HTC Insights</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Noto+Serif+Thai:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', 'IBM Plex Sans Thai', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif Thai', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.3;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 960px; display: block; }
    svg .n { fill: #2d3142; font-size: 12px; font-weight: 600; font-family: 'Geist', 'IBM Plex Sans Thai', sans-serif; text-anchor: middle; }
    svg .s { fill: #4f5d75; font-size: 11px; font-family: 'Geist', 'IBM Plex Sans Thai', sans-serif; text-anchor: middle; }
    svg .m { fill: #4f5d75; font-size: 9px; font-family: 'Geist Mono', monospace; text-anchor: middle; }
    svg .l { fill: #4f5d75; font-size: 12px; font-weight: 500; font-family: 'Geist', 'IBM Plex Sans Thai', sans-serif; text-anchor: middle; }
    svg .lk { fill: #4f5d75; font-size: 10px; font-family: 'Geist', 'IBM Plex Sans Thai', sans-serif; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · 2 / 3 · HTC Insights</p>
    <h1>เส้นทางเนื้อหาผ่านการคัดกรอง</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="htc-flow-content-title htc-flow-content-desc">
        <title id="htc-flow-content-title">เส้นทางเนื้อหาผ่านการคัดกรองของ HTC Insights</title>
        <desc id="htc-flow-content-desc">เนื้อหาทุกชิ้นเกิดเป็นสถานะรอตรวจ ผู้ดูแลอนุมัติให้เผยแพร่หรือปฏิเสธพร้อมเหตุผล เนื้อหาที่เผยแพร่แล้วถ้าถูกรายงาน ผู้ดูแลถอนออกได้ และรีวิวที่ถูกปฏิเสธแก้แล้วส่งตรวจใหม่ได้</desc>
        <defs>
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
          </pattern>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>
        <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

        <!-- Arrows (drawn first, behind nodes) -->
        <line x1="360" y1="88" x2="360" y2="116" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="360" y1="168" x2="360" y2="196" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="360" y1="248" x2="360" y2="268" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="360" y1="368" x2="360" y2="404" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <line x1="470" y1="320" x2="656" y2="320" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="460" y1="432" x2="656" y2="432" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="760" y1="408" x2="760" y2="348" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M760 296 L760 68 Q760 60 752 60 L484 60" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

        <!-- Arrow labels (Thai: 12px sans, 16px mask) -->
        <rect x="370" y="378" width="52" height="16" rx="2" fill="#f5f5f5"/>
        <text class="l" x="396" y="390" style="fill:#eb6c36">อนุมัติ</text>
        <rect x="535" y="294" width="56" height="16" rx="2" fill="#f5f5f5"/>
        <text class="l" x="563" y="306">ปฏิเสธ</text>
        <rect x="518" y="406" width="80" height="16" rx="2" fill="#f5f5f5"/>
        <text class="l" x="558" y="418">มีคนรายงาน</text>
        <rect x="770" y="368" width="72" height="16" rx="2" fill="#f5f5f5"/>
        <text class="l" x="806" y="380">ถอนเนื้อหา</text>
        <rect x="770" y="170" width="112" height="16" rx="2" fill="#f5f5f5"/>
        <text class="l" x="826" y="182">รีวิวแก้แล้วส่งใหม่</text>

        <!-- Start oval -->
        <rect x="232" y="32" width="256" height="56" rx="28" fill="#f5f5f5"/>
        <rect x="232" y="32" width="256" height="56" rx="28" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text class="n" x="360" y="56">ผู้ใช้ส่งเนื้อหา</text>
        <text class="s" x="360" y="73">รีวิว · กระทู้ · ความคิดเห็น · ประกาศงาน</text>

        <!-- Pending -->
        <rect x="260" y="120" width="200" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text class="n" x="360" y="141">รอตรวจ</text>
        <text class="m" x="360" y="156">status = PENDING</text>

        <!-- Moderation center -->
        <rect x="260" y="200" width="200" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text class="n" x="360" y="221">ศูนย์คัดกรอง</text>
        <text class="s" x="360" y="237">ผู้ดูแลเห็นตัวตนผู้เขียน</text>

        <!-- Decision -->
        <polygon points="360,272 470,320 360,368 250,320" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text class="n" x="360" y="317">ผ่านกฎและ</text>
        <text class="n" x="360" y="333">ผู้ดูแลอนุมัติ?</text>

        <!-- Published (focal) -->
        <rect x="260" y="408" width="200" height="48" rx="6" fill="#f5f5f5"/>
        <rect x="260" y="408" width="200" height="48" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
        <text class="n" x="360" y="429">เผยแพร่สาธารณะ</text>
        <text class="m" x="360" y="444">status = APPROVED</text>

        <!-- Rejected -->
        <rect x="660" y="296" width="200" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text class="n" x="760" y="317">ปฏิเสธพร้อมเหตุผล</text>
        <text class="m" x="760" y="332">status = REJECTED</text>

        <!-- Reported -->
        <rect x="660" y="408" width="200" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text class="n" x="760" y="429">ข้อร้องเรียน</text>
        <text class="s" x="760" y="445">ผู้ดูแลตรวจว่าผิดกฎไหม</text>

        <!-- Legend -->
        <line x1="40" y1="496" x2="920" y2="496" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="40" y="512" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND · SHAPE CARRIES TYPE</text>

        <rect x="40" y="526" width="24" height="12" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text class="lk" x="72" y="536">เริ่ม</text>
        <rect x="128" y="526" width="24" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text class="lk" x="160" y="536">ขั้นตอน / สถานะ</text>
        <polygon points="276,532 288,526 300,532 288,538" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text class="lk" x="312" y="536">เงื่อนไข</text>
        <line x1="380" y1="532" x2="408" y2="532" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <text class="lk" x="416" y="536">เส้นทางหลัก</text>
        <line x1="500" y1="532" x2="528" y2="532" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <text class="lk" x="536" y="536">ส่งกลับไปตรวจใหม่</text>

        <text class="lk" x="40" y="564">ทุกการตัดสิน: แจ้งเจ้าของพร้อมเหตุผล และบันทึกประวัติผู้ดูแล ในทรานแซกชันเดียวกัน</text>
        <text class="lk" x="40" y="582">สาธารณะเห็นเฉพาะ APPROVED รวมถึงตัวนับและค่าเฉลี่ยคะแนน · ถอนความคิดเห็นแล้วคำตอบใต้มันถูกปฏิเสธทั้งกิ่ง</text>
      </svg>
    </div>
  </div>
</body>
</html>
