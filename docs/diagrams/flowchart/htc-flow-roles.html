<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เข้าสู่ระบบและบทบาทผู้ใช้ · HTC Insights</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Noto+Serif+Thai:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', 'IBM Plex Sans Thai', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif Thai', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.3;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 960px; display: block; }
    svg .n { fill: #2d3142; font-size: 12px; font-weight: 600; font-family: 'Geist', 'IBM Plex Sans Thai', sans-serif; text-anchor: middle; }
    svg .s { fill: #4f5d75; font-size: 11px; font-family: 'Geist', 'IBM Plex Sans Thai', sans-serif; text-anchor: middle; }
    svg .m { fill: #4f5d75; font-size: 9px; font-family: 'Geist Mono', monospace; text-anchor: middle; }
    svg .l { fill: #4f5d75; font-size: 12px; font-weight: 500; font-family: 'Geist', 'IBM Plex Sans Thai', sans-serif; text-anchor: middle; }
    svg .lk { fill: #4f5d75; font-size: 10px; font-family: 'Geist', 'IBM Plex Sans Thai', sans-serif; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · 1 / 3 · HTC Insights</p>
    <h1>เข้าสู่ระบบและบทบาทผู้ใช้</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="htc-flow-roles-title htc-flow-roles-desc">
        <title id="htc-flow-roles-title">เข้าสู่ระบบและบทบาทผู้ใช้ของ HTC Insights</title>
        <desc id="htc-flow-roles-desc">ผู้ใช้เข้าสู่ระบบด้วย Google ระบบปฏิเสธบัญชีที่ยังไม่ยืนยันอีเมลหรือถูกระงับ แล้วกำหนดบทบาทเป็นผู้ดูแลระดับสูง นักศึกษา หรือบุคคลภายนอก ซึ่งยื่นคำขอยืนยันสิทธิ์เพื่อเป็นนักศึกษาได้</desc>
        <defs>
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
          </pattern>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>
        <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

        <!-- Arrows (drawn first, behind nodes) -->
        <line x1="480" y1="80" x2="480" y2="96" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="590" y1="140" x2="676" y2="140" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="480" y1="184" x2="480" y2="208" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="590" y1="252" x2="676" y2="252" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="480" y1="296" x2="480" y2="320" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="370" y1="364" x2="284" y2="364" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <line x1="590" y1="364" x2="676" y2="364" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="780" y1="388" x2="780" y2="436" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M680 464 L188 464 Q180 464 180 456 L180 392" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- Arrow labels (Thai: 12px sans, 16px mask) -->
        <rect x="621" y="114" width="28" height="16" rx="2" fill="#f5f5f5"/>
        <text class="l" x="635" y="126">ไม่</text>
        <rect x="490" y="188" width="28" height="16" rx="2" fill="#f5f5f5"/>
        <text class="l" x="504" y="200">ใช่</text>
        <rect x="621" y="226" width="28" height="16" rx="2" fill="#f5f5f5"/>
        <text class="l" x="635" y="238">ใช่</text>
        <rect x="490" y="300" width="28" height="16" rx="2" fill="#f5f5f5"/>
        <text class="l" x="504" y="312">ไม่</text>
        <rect x="313" y="338" width="28" height="16" rx="2" fill="#f5f5f5"/>
        <text class="l" x="327" y="350" style="fill:#eb6c36">ใช่</text>
        <rect x="621" y="338" width="28" height="16" rx="2" fill="#f5f5f5"/>
        <text class="l" x="635" y="350">ไม่</text>
        <rect x="396" y="438" width="88" height="16" rx="2" fill="#f5f5f5"/>
        <text class="l" x="440" y="450">ผู้ดูแลอนุมัติ</text>

        <!-- Start oval -->
        <rect x="380" y="32" width="200" height="48" rx="24" fill="#f5f5f5"/>
        <rect x="380" y="32" width="200" height="48" rx="24" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text class="n" x="480" y="60">เข้าสู่ระบบด้วย Google</text>

        <!-- Decision 1 -->
        <polygon points="480,96 590,140 480,184 370,140" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text class="n" x="480" y="137">ยืนยันอีเมลกับ Google</text>
        <text class="n" x="480" y="153">และไม่ถูกระงับ?</text>

        <!-- End: blocked -->
        <rect x="680" y="116" width="200" height="48" rx="24" fill="#f5f5f5"/>
        <rect x="680" y="116" width="200" height="48" rx="24" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text class="n" x="780" y="137">เข้าระบบไม่ได้</text>
        <text class="s" x="780" y="153">แจ้งเหตุผลที่หน้าเข้าสู่ระบบ</text>

        <!-- Decision 2: super admin -->
        <polygon points="480,208 590,252 480,296 370,252" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text class="n" x="480" y="249">อีเมลตรงกับ</text>
        <text class="m" x="480" y="264">SUPER_ADMIN_EMAIL?</text>

        <!-- Super admin -->
        <rect x="680" y="228" width="200" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text class="n" x="780" y="249">ผู้ดูแลระดับสูง</text>
        <text class="s" x="780" y="265">คัดกรอง · แดชบอร์ด · รายงาน A4</text>

        <!-- Decision 3: college domain -->
        <polygon points="480,320 590,364 480,408 370,364" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text class="n" x="480" y="361">อีเมลโดเมน</text>
        <text class="n" x="480" y="377">ของวิทยาลัย?</text>

        <!-- Student (focal) -->
        <rect x="80" y="340" width="200" height="48" rx="6" fill="#f5f5f5"/>
        <rect x="80" y="340" width="200" height="48" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
        <text class="n" x="180" y="361">นักศึกษา</text>
        <text class="s" x="180" y="377">รีวิว · เว็บบอร์ด · ค้นหาบริษัท</text>

        <!-- External -->
        <rect x="680" y="340" width="200" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text class="n" x="780" y="361">บุคคลภายนอก</text>
        <text class="s" x="780" y="377">ลงทะเบียนบริษัท · ลงประกาศงาน</text>

        <!-- Upgrade request -->
        <rect x="680" y="440" width="200" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text class="n" x="780" y="461">ยื่นคำขอยืนยันสิทธิ์</text>
        <text class="s" x="780" y="477">รหัสนักศึกษา + รูปบัตร</text>

        <!-- Legend -->
        <line x1="40" y1="520" x2="920" y2="520" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="40" y="536" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND · SHAPE CARRIES TYPE</text>

        <rect x="40" y="552" width="24" height="12" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text class="lk" x="72" y="562">เริ่ม / จบ</text>
        <rect x="160" y="552" width="24" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text class="lk" x="192" y="562">บทบาท / ขั้นตอน</text>
        <polygon points="312,558 324,552 336,558 324,564" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text class="lk" x="348" y="562">เงื่อนไข</text>
        <line x1="420" y1="558" x2="448" y2="558" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <text class="lk" x="456" y="562">เส้นทางหลัก</text>
        <text class="lk" x="560" y="562">บทบาทตัดสินครั้งเดียวตอนสร้างบัญชี · ผู้ดูแลทั่วไปแต่งตั้งโดยผู้ดูแลระดับสูง</text>
      </svg>
    </div>
  </div>
</body>
</html>
