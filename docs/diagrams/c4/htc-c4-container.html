<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ส่วนประกอบหลักของระบบ · HTC Insights</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Noto+Serif+Thai:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', 'IBM Plex Sans Thai', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif Thai', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.3;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 960px; display: block; }
    svg .n { fill: #2d3142; font-size: 12px; font-weight: 600; font-family: 'Geist', 'IBM Plex Sans Thai', sans-serif; text-anchor: middle; }
    svg .s { fill: #4f5d75; font-size: 11px; font-family: 'Geist', 'IBM Plex Sans Thai', sans-serif; text-anchor: middle; }
    svg .m { fill: #4f5d75; font-size: 9px; font-family: 'Geist Mono', 'IBM Plex Sans Thai', monospace; text-anchor: middle; }
    svg .l { fill: #4f5d75; font-size: 12px; font-weight: 500; font-family: 'Geist', 'IBM Plex Sans Thai', sans-serif; text-anchor: middle; }
    svg .lk { fill: #4f5d75; font-size: 10px; font-family: 'Geist', 'IBM Plex Sans Thai', sans-serif; }
    svg .t { fill: #4f5d75; font-size: 7px; font-family: 'Geist Mono', monospace; text-anchor: middle; letter-spacing: 0.08em; }
    svg .g { fill: #4f5d75; font-size: 9px; font-family: 'Geist Mono', 'IBM Plex Sans Thai', monospace; letter-spacing: 0.04em; }
    svg .et { fill: #4f5d75; font-size: 8px; font-family: 'Geist Mono', monospace; letter-spacing: 0.14em; }
    svg .e { fill: #2d3142; font-size: 14px; font-weight: 600; font-family: 'Geist', 'IBM Plex Sans Thai', sans-serif; }
    svg .f { fill: #2d3142; font-size: 10px; font-family: 'Geist Mono', 'IBM Plex Sans Thai', monospace; }
    svg .ft { fill: #4f5d75; font-size: 10px; font-family: 'Geist Mono', 'IBM Plex Sans Thai', monospace; text-anchor: end; }
    svg .c { fill: #4f5d75; font-size: 10px; font-weight: 600; font-family: 'Geist Mono', monospace; text-anchor: middle; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
